name: Build Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet run --project tests/ExplorerOne.Tests -c Release

      - name: Run native protocol tests
        shell: pwsh
        run: ./tests/ExplorerOne.Native.Tests/run.ps1

      - name: Run startup registration tests
        run: dotnet run --project tests/ExplorerOne.Startup.Tests -c Release

      - name: Build application
        run: dotnet build src/ExplorerOne/ExplorerOne.csproj -c Release

      - name: Publish Windows x64 application
        run: dotnet publish src/ExplorerOne/ExplorerOne.csproj -c Release -r win-x64 --self-contained false -o publish/ExplorerOne-win-x64

      - name: Build Windows installer
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md -Destination publish/ExplorerOne-win-x64/
          New-Item -ItemType Directory -Path publish/ExplorerOne-win-x64/docs -Force | Out-Null
          Copy-Item docs/manual-tests.md, docs/verification.md -Destination publish/ExplorerOne-win-x64/docs/
          ./installer/build.ps1 -PublishedDirectory publish/ExplorerOne-win-x64 -OutputDirectory outputs

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: ExplorerOne-Setup-win-x64
          path: outputs/ExplorerOne-Setup-*-win-x64.exe
          if-no-files-found: error
          retention-days: 30
